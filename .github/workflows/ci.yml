name: ci
on: [push, pull_request]

jobs:
  # The TypeScript test suite runs directly from .ts via Node's type stripping,
  # which only exists from 22.6. Node 20 is covered by the `smoke` job below,
  # against the built artifact - which is what a consumer actually runs.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip pytest
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  # Proves the shipped artifact runs on the oldest supported Node.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - run: node dist/surface/cli.js --version
